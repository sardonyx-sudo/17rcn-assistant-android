name: 扶輪公益網助手 APK 雲端自動編譯

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支援在 GitHub 網頁上一鍵手動觸發編譯

permissions:
  contents: write

jobs:
  build:
    name: 編譯 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 下載原始碼
        uses: actions/checkout@v4

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Gradle 快取
        uses: gradle/actions/setup-gradle@v3

      - name: 賦予 gradlew 執行權限
        run: chmod +x gradlew

      - name: 執行 Gradle 編譯 Debug APK
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper
          fi
          ./gradlew assembleDebug --stacktrace

      - name: 上傳 Artifacts 產出物 (保留30天)
        uses: actions/upload-artifact@v4
        with:
          name: 扶輪公益網刊登助手-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 發布至 GitHub Releases (免登入一鍵直裝 APK)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "扶輪公益網刊登助手 最新 Android 版本"
          body: "扶輪公益網 (17rcn.org) 專屬 Android App。點擊下方 Assets 中的 APK 檔案即可直接在手機下載安裝，無需解壓縮！"
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
